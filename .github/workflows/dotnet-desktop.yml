name: Build PriExplorer

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Publish PriExplorer
        run: dotnet publish PriExplorer/PriExplorer.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PriExplorer
          path: out/*
