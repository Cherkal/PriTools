name: Build PriExplorer

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish PriExplorer
        run: dotnet publish PriExplorer/PriExplorer.csproj -c Release -r win-x64 --self-contained false -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PriExplorer
          path: out/*
